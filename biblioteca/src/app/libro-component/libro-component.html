<div class="reg">
<h1> Registrar Libro</h1>

<form (ngSubmit)="guardar()">
    <label>Codigo</label>
    <input type="text" id="codigo" name="codigo" [(ngModel)]="codigo" required>

    <label>Titulo</label>
    <input type="text" id="titulo" name="titulo" [(ngModel)]="titulo" required>

    <label>Autor</label>
    <input type="text" id="autor" name="autor" [(ngModel)]="autor" required>

    <label>Anio</label>
    <input type="number" id="anio" name="anio" [(ngModel)]="anio" required>

    <button type="submit">Guardar</button>


</form>
</div>

<p>La cantidad de libros: {{libros.length}}</p>

@if ( libros.length == 0){
    <p>No hay datos en la tabla</p>
}
<table border="2">

    <tr>
        <th>Id</th>
        <th>Codigo</th>
        <th>Titulo</th>
        <th>autor</th>
        <th>Año</th>
    </tr>

    @for (libro of libros; track libro.id){
        <tr>
            <td>{{libro.id}}</td>
            <td>{{libro.codigo}}</td>
            <td>{{libro.titulo}}</td>
            <td>{{libro.autor}}</td>
            <td>{{libro.anio}}</td>
        </tr>
    }

</table>

<button type="button" (click)="cerrarSesion()">Cerrar Sesion</button>
